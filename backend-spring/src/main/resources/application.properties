spring.application.name=taller-reparacion

# Conexion a MySQL: la base taller_reparacion se crea sola si no existe (createDatabaseIfNotExist)
spring.datasource.url=jdbc:mysql://localhost:3306/taller_reparacion?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Bogota
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Usuario y clave de MySQL: cada quien los pone en application-local.properties (no se sube a git;
# copiar application-local.properties.example) o en las variables de entorno DB_USERNAME / DB_PASSWORD
spring.config.import=optional:classpath:application-local.properties
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

# Crea las tablas con schema.sql (CREATE TABLE IF NOT EXISTS: no borra nada) antes de que Hibernate valide
spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Swagger / OpenAPI
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.tags-sorter=alpha
springdoc.api-docs.path=/v3/api-docs
