spring.application.name=taller-reparacion
spring.config.import=optional:classpath:application-local.properties

# Atlas: guarda la URI completa en la variable de entorno MONGODB_URI.
# Para desarrollo local sin MongoDB instalado se puede usar MongoDB Atlas.
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/autocore}
spring.data.mongodb.auto-index-creation=true

# Swagger / OpenAPI
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.tags-sorter=alpha
springdoc.api-docs.path=/v3/api-docs

# Configuración JWT
autocore.jwt.secret=${JWT_SECRET}
autocore.jwt.expiration-ms=28800000
